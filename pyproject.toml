[project]
name = "agent"
version = "0.1.0"
description = "AI Agent 学习项目"
readme = "README.md"
authors = [
    { name = "zilan666", email = "105700799+zilan666@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
